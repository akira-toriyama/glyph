name: glyph-release

# Reusable rolling-DRAFT release for the Swift family — glyph's OFFICIAL
# release integration and the successor of akira-toriyama/.github's
# release.yml@v1 (git-cliff). It ships either artifact shape the family
# builds: an `<App>.app` bundle (`app:` — package.sh → <App>.zip) or a bare
# binary (`binary:` — build.sh → bin/<binary> + a sha256). The workflow and
# the binary it runs ship from the same repo and the same release, so a
# caller pins ONE concrete tag (@vX.Y.Z, never a moving ref) and can never
# mix workflow and binary revisions. GoReleaser owns glyph's OWN tag-driven
# releases (goreleaser.yml) — this file is the reusable the family consumes.
#
# Passing NEITHER is the third shape: a repo whose release IS the notes gets
# the verdict and the draft upsert and nothing else — ubuntu runner, no Xcode,
# no build, no assets. It exists so the live-fire range (glyph-test) can call
# THIS file instead of a hand copy of it. A range that fires a different gun
# proves nothing about this one, and the hand copy had already drifted three
# glyph releases behind the workflows around it once.
#
# A push to the caller's main makes `glyph release` walk main's squash
# commits since the last v* tag, resolve each to its merged pull request over
# the API and classify the PR's individual (pre-squash) commits — squash-safe,
# stateless, self-healing (glyph docs/DESIGN.md §4) — then upsert the ONE
# glyph-managed rolling DRAFT release: tag = the next version, body = the
# grouped notes plus the caller's install block (`--footer-file`), target =
# the walked HEAD. No git tag is created — GitHub tags the target commit when
# a human publishes — and immutable releases stay deadlock-free: the next
# version must clear the published floor, and drafts are deleted by release
# id only, never by tag name. On a none verdict glyph deletes residual
# glyph-managed drafts (the draft state converges to the verdict) and exits 1,
# which this workflow folds into a success no-op — the soft no-release code
# is handled here once, so callers never script around it. A walk that could
# not READ its range fails loud instead: glyph exits 4 before touching any
# draft, because an empty (or short) fold from a walk that could not look is
# not evidence about the range, and that exit propagates as a red run whose
# error names what the walk could not read. No new branch here — every
# non-0/1 status already falls through as a failure, deliberately.
#
# The build stays the repo's uniform script — package.sh for an app bundle,
# build.sh for a bare binary (each runs `swift build -c release` itself) —
# with an optional post-build smoke, exactly as in the @v1 reusable; only
# the verdict engine changed. The upsert runs BEFORE the build: the verdict
# comes from one walk (tag and body can never split), and a build failure at
# worst leaves the draft's asset one merge stale — the next green run
# re-uploads with --clobber, and nothing is published without a human anyway.
#
# Caller skeleton (.github/workflows/release.yml in each consuming repo):
#   on:
#     push: { branches: [main] }
#     workflow_dispatch:
#       inputs:
#         dry_run: { description: "Preview only", type: boolean, default: false }
#   concurrency: { group: release, cancel-in-progress: false }
#   permissions: { contents: write }
#   jobs:
#     release:
#       uses: akira-toriyama/glyph/.github/workflows/release.yml@vX.Y.Z  # pin a release tag
#       with:
#         app: Facet              # → Facet.app / Facet.zip, binary `facet`
#         # …or, for a bare-binary tool (at most one of app/binary):
#         # binary: glance        # → ./build.sh must produce bin/glance; attaches glance + glance.sha256
#         # …or NEITHER, for a repo that ships no artefact: the verdict and
#         # the rolling draft, on ubuntu, and nothing built.
#         smoke: false            # true → run `<artifact> --validate`
#         dry-run: ${{ github.event.inputs.dry_run == 'true' }}
#         install-notes: |
#           ## Install
#           …app-specific markdown appended after the notes…
#
# @vX.Y.Z is a PLACEHOLDER, not a ref — substitute a concrete tag from
# https://github.com/akira-toriyama/glyph/releases. No live version is written
# here because none can be: a tag is cut on a commit that ALREADY EXISTS, so any
# version typed into this file names the PREVIOUS release the moment it ships.
# Unlike lint.yml and pr-verdict.yml there is no in-repo caller to copy — glyph
# releases itself through goreleaser.yml, not through this reusable — so the
# releases page is the only source for the tag. (This is also why a naive grep
# for glyph pins must skip comments: internal/workflows guards both halves.)

on:
  workflow_call:
    inputs:
      app:
        description: "App display name, e.g. 'Facet' → package.sh builds Facet.app, attaches Facet.zip, binary `facet`. At most one of `app` / `binary`; neither is verdict-only."
        required: false
        type: string
        default: ""
      binary:
        description: "Bare-binary name, e.g. 'glance' → ./build.sh must produce bin/<binary>; attaches <binary> + <binary>.sha256. At most one of `app` / `binary`; neither is verdict-only."
        required: false
        type: string
        default: ""
      install-notes:
        description: "Markdown appended verbatim after the generated notes, separated by one --- line (the per-repo `## Install` block)."
        required: true
        type: string
      smoke:
        description: "Run the built artifact with `--validate` after the build (`./<App>.app/Contents/MacOS/<app-lowercased>` in app mode, `./bin/<binary>` in binary mode)."
        required: false
        type: boolean
        default: false
      smoke-cmd:
        description: "Post-build smoke args, e.g. 'config --validate' — runs the built artifact with these args. Takes precedence over `smoke`; empty falls back to `smoke`."
        required: false
        type: string
        default: ""
      dry-run:
        description: "Preview only — the full verdict (draft action included) and the build, but no GitHub write (thread the caller's workflow_dispatch input)."
        required: false
        type: boolean
        default: false
      glyph-version:
        description: >-
          Override the glyph release whose binary computes the verdict (vX.Y.Z,
          v0.3.0 minimum — earlier binaries were attested under the pre-rename
          signer path). Leave empty (the default) and the version is derived
          from the tag the caller pinned this reusable to (job.workflow_ref), so
          @vX.Y.Z runs binary vX.Y.Z automatically. Set it only when pinning a
          non-tag ref (a branch or SHA), which has no release binary to derive.
        type: string
        default: ""
    outputs:
      # The verdict, machine-readable, so a caller can act on what this run
      # already computed instead of re-deriving it (installing glyph again, or
      # re-implementing the convention in grep — both fork the rules).
      #
      # EMPTY MEANS NOT COMPUTED, never "none": the run died before the
      # verdict, or an arm could not read its envelope. A caller gating on
      # these must fail safe on "".
      #
      # The draft's URL is deliberately NOT an output. With the API handle in
      # hand, auto-publishing the draft is a two-line caller step — and the
      # human act of publishing (and therefore cutting the tag) is the safety
      # net §4/§6 rest on. A human finds the draft where humans look: the
      # releases page; the run's own log prints it.
      level:
        description: >-
          The bump the range folded to: none | patch | minor | major. Empty
          when no verdict was computed.
        value: ${{ jobs.release.outputs.level }}
      next:
        description: >-
          The tag the rolling draft targets (vX.Y.Z). Empty on a none verdict
          — nothing is due — and empty when no verdict was computed.
        value: ${{ jobs.release.outputs.next }}
      current:
        description: >-
          The version the walk stepped from (the tag the walk named, else the
          highest parseable v* tag, else v0.0.0). Empty when no verdict was
          computed.
        value: ${{ jobs.release.outputs.current }}
      action:
        description: >-
          What the upsert did (or, on a dry run, would do) to the rolling
          draft: create | update | delete | none. Empty when no verdict was
          computed.
        value: ${{ jobs.release.outputs.action }}

permissions:
  contents: write

jobs:
  release:
    # macos-26: family apps on the macOS-26 floor (sill v2.0.0+) ship
    # macOS-26 binaries the smoke step must EXECUTE — a macos-15 host can
    # compile them but cannot run them.
    #
    # …but only when there IS an artifact. A verdict-only caller (neither
    # `app` nor `binary`) runs one Go binary over git and the API and has no
    # Swift, no Xcode and nothing to execute; putting it on a macOS runner
    # would spend the family's scarcest minutes to compute a version number.
    # The reusable decides this from the inputs rather than taking a `runs-on`
    # input, because there is no combination of the two a caller should pick.
    runs-on: ${{ (inputs.app != '' || inputs.binary != '') && 'macos-26' || 'ubuntu-latest' }}
    # Bounded so a hung step (build, signing, upload) can't burn the macOS
    # minutes budget. Generous — a cold build + package + upload fits easily.
    timeout-minutes: 30
    outputs:
      level: ${{ steps.verdict.outputs.level }}
      next: ${{ steps.verdict.outputs.next }}
      current: ${{ steps.verdict.outputs.current }}
      action: ${{ steps.verdict.outputs.action }}
    steps:
      # `required: true` cannot express "at most one of app/binary", so the
      # arity is enforced here, before anything else runs. NEITHER is the
      # verdict-only mode — a repo whose release IS the notes (glyph-test is
      # the one in the fleet) — and it is a real mode rather than an oversight,
      # so it is spelled out in the log. BOTH is still an error: there is one
      # artifact per release and no order in which two would attach.
      - name: Validate the artifact inputs
        env:
          APP: ${{ inputs.app }}
          BINARY: ${{ inputs.binary }}
        run: |
          set -euo pipefail
          if [ -n "$APP" ] && [ -n "$BINARY" ]; then
            echo "::error::at most one of 'app' (app bundle via package.sh) or 'binary' (bare binary via build.sh) may be set."
            exit 1
          fi
          if [ -z "$APP" ] && [ -z "$BINARY" ]; then
            echo "::notice::verdict-only: no 'app' or 'binary', so this run computes the verdict and upserts the draft, and builds nothing."
          fi

      # A release run WRITES — it upserts the one glyph-managed rolling draft
      # and re-points its target — so the ref it runs from decides what the
      # repository is about to ship. Off the default branch every one of those
      # writes is wrong, and NOTHING downstream says so: the walk's range is
      # <tag>..HEAD over this ref, so the branch's unmerged commits enter the
      # notes; each resolves to no merged pull request and falls to the
      # direct-push arm, classified from its own subject; and the exit-4
      # refusal for a walk that could not read its range never fires, because
      # only an API lag is recorded as dropped. The run is green, the draft
      # holds unmerged work, and Publish puts the tag on the branch tip.
      #
      # Refuse, do not warn — lint.yml's push arm draws this same boundary for
      # the same reason (a gate that answers without judging is the defect
      # class these guards exist to close), and the argument is stronger here
      # because that arm only READS while this path writes. Refusing first also
      # means a mis-triggered run spends no runner minutes.
      #
      # dry-run is the way through: previewing the notes from a topic branch
      # writes nothing, which is what a caller's workflow_dispatch is for.
      - name: Refuse a release run from a non-default ref
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run from $RELEASE_REF: the verdict is computed and nothing is written, so the ref is not judged."
            exit 0
          fi
          # Fail closed on a boundary this guard cannot see. Measured on
          # 2026-08-11 (glyph-test's ref-probe, dispatched from main and from a
          # topic branch): a workflow_dispatch payload carries default_branch
          # exactly as a push payload does, so an empty value means the event
          # shape changed under the guard rather than an ordinary run. The bare
          # comparison below would refuse such a run anyway — `refs/heads/`
          # matches no ref — but it would name the wrong cause, and a refusal
          # nobody can diagnose gets worked around instead of fixed.
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo "::error::glyph-release cannot read this repository's default branch from the event payload; refusing rather than writing the rolling draft from an unverified ref ($RELEASE_REF)."
            exit 1
          fi
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::glyph-release writes the rolling draft from the default branch only ($RELEASE_REF is not refs/heads/$DEFAULT_BRANCH): a run from another ref folds that ref's unmerged commits into the notes and retargets the draft at its HEAD. Dispatch with dry_run: true to preview from here."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # glyph walks the tags and the range out of LOCAL git (its verdict
          # commands run inside a checkout by contract), so the full history
          # must be here.
          fetch-depth: 0
          # Every release write goes through glyph/gh + the GH_TOKEN env,
          # never git push — don't leave the checkout token in .git/config
          # (zizmor artipacked).
          persist-credentials: false

      # Both of these serve the Swift build and nothing else, and neither
      # exists on the ubuntu runner a verdict-only run lands on: setup-xcode
      # would fail outright there, and the SPM cache would key a path that is
      # never written. Gated on the same predicate as `runs-on` above.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        if: inputs.app != '' || inputs.binary != ''
        with:
          xcode-version: latest-stable

      # Same SPM cache as the swift-build action — package.sh runs `swift
      # build` underneath, so the warm artefacts help here too. The repo name
      # guards against stale PCH module-cache paths after a rename, and
      # Package.resolved is hashed so a dependency bump invalidates the cache
      # (hashFiles tolerates it missing for deps-free repos).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.app != '' || inputs.binary != ''
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ github.event.repository.name }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-${{ github.event.repository.name }}-

      # Resolve the binary version from the tag the caller pinned this reusable
      # to (job.workflow_ref = …@refs/tags/vX.Y.Z), so the tag IS the version —
      # no hand-bumped default to drift. The override input covers a branch/SHA
      # pin, which has no release binary to derive from.
      - name: Resolve the pinned glyph version
        id: glyph
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          OVERRIDE: ${{ inputs.glyph-version }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ]; then
            echo "version=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${WORKFLOW_REF##*@}"
          case "$ref" in
            refs/tags/*) echo "version=${ref#refs/tags/}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::glyph-release is pinned to a non-tag ref ($ref); pass glyph-version to pick a release binary."; exit 1 ;;
          esac

      # Check out glyph's OWN source at the pinned commit so the install action
      # is available locally — a relative `uses:` in a reusable workflow resolves
      # against the CALLER's workspace, not glyph's, so the action must be
      # checked out here (the composite auto-detects this macOS runner and pulls
      # the darwin tarball). AFTER the caller checkout above, whose workspace-root
      # clean would otherwise wipe this untracked subdirectory.
      - name: Check out glyph's install action at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .glyph-action
          persist-credentials: false

      - name: Install glyph (pinned release binary, checksum + provenance verified)
        uses: ./.glyph-action/.github/actions/install
        with:
          version: ${{ steps.glyph.outputs.version }}
          token: ${{ github.token }}

      # ONE walk composes the whole verdict (tag + body) and, unless this is
      # a dry run, upserts the rolling draft in the same call — recomputed
      # from git every run, so it is idempotent and self-healing. Exit 1 is
      # the uniform soft no-release: fold it into a success no-op here.
      - name: Compose the verdict and upsert the rolling DRAFT
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_NOTES: ${{ inputs.install-notes }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          # The caller's install block reaches glyph as a FILE (--footer-file)
          # — printf %s, no shell expansion of its backticks / $(…), and no
          # markdown ever concatenated in shell (ratified Q11).
          printf '%s' "$INSTALL_NOTES" > "$RUNNER_TEMP/install-notes.md"
          args=(release --json --footer-file "$RUNNER_TEMP/install-notes.md")
          if [ "$DRY_RUN" = "true" ]; then
            args=(release --dry-run --json --footer-file "$RUNNER_TEMP/install-notes.md")
          fi
          status=0
          glyph "${args[@]}" > "$RUNNER_TEMP/verdict.json" 2> "$RUNNER_TEMP/verdict.err" || status=$?
          cat "$RUNNER_TEMP/verdict.err" >&2
          # The four caller-facing outputs are written on BOTH answer arms from
          # the same envelope the run itself acts on — never re-derived. On any
          # arm that cannot read its envelope they stay "", and "" means NOT
          # COMPUTED by the workflow_call contract (a skipped or dead run reads
          # the same), so the reads are best-effort on purpose.
          emit() { echo "$1=$(jq -r "$2 // empty" "$RUNNER_TEMP/verdict.json" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"; }
          if [ "$status" -eq 1 ]; then
            # Soft no-release: nothing version-worthy since the last tag.
            # glyph already converged the draft state (residual glyph-managed
            # drafts deleted — ratified Q3), so this run is complete.
            reason="$(jq -r '.reason // empty' "$RUNNER_TEMP/verdict.json" 2>/dev/null || true)"
            echo "::notice::${reason:-no release-worthy changes since the last tag} — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            emit level   .level
            emit current .current
            emit action  .action
            # No tag is due on a none verdict; empty, not the absent field's null.
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          tag="$(jq -r .tag "$RUNNER_TEMP/verdict.json")"
          action="$(jq -r .action "$RUNNER_TEMP/verdict.json")"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          emit level   .level
          emit current .current
          emit action  .action
          echo "next=$tag" >> "$GITHUB_OUTPUT"
          echo "verdict: $tag (draft $action)"

      # Build <App>.app via package.sh (ad-hoc signed for CI — the script
      # picks $CODESIGN_ID > .signing-id > "-"). Optional smoke for apps that
      # have one.
      - name: Build app + zip
        if: steps.verdict.outputs.release == 'true' && inputs.app != ''
        env:
          CODESIGN_ID: "-"
          APP: ${{ inputs.app }}
          SMOKE: ${{ inputs.smoke }}
          SMOKE_CMD: ${{ inputs.smoke-cmd }}
        run: |
          set -euo pipefail
          ./package.sh
          bin="$(echo "$APP" | tr '[:upper:]' '[:lower:]')"
          # `smoke-cmd` (e.g. `config --validate`) takes precedence; else the
          # boolean `smoke` runs `--validate`. Unquoted on purpose so
          # multi-word args split.
          if [ -n "$SMOKE_CMD" ]; then
            # shellcheck disable=SC2086 # intentional word-split (see above)
            "./${APP}.app/Contents/MacOS/${bin}" $SMOKE_CMD
          elif [ "$SMOKE" = "true" ]; then
            "./${APP}.app/Contents/MacOS/${bin}" --validate
          fi
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "${APP}.app" "artifacts/${APP}.zip"

      # Build the bare binary via build.sh (contract: it leaves the release
      # binary at bin/<binary>, ad-hoc signed in CI). The sha256 goes through
      # `openssl dgst -r` — same `<hash> *<file>` line `shasum -c` verifies —
      # because `shasum` itself is an install-only token the workflows test
      # forbids in a reusable's executable body (internal/workflows).
      - name: Build binary + sha256
        if: steps.verdict.outputs.release == 'true' && inputs.binary != ''
        env:
          BINARY: ${{ inputs.binary }}
          SMOKE: ${{ inputs.smoke }}
          SMOKE_CMD: ${{ inputs.smoke-cmd }}
        run: |
          set -euo pipefail
          ./build.sh
          # Same smoke contract as app mode: `smoke-cmd` takes precedence,
          # the boolean runs `--validate`. Unquoted so multi-word args split.
          if [ -n "$SMOKE_CMD" ]; then
            # shellcheck disable=SC2086 # intentional word-split (see above)
            "./bin/${BINARY}" $SMOKE_CMD
          elif [ "$SMOKE" = "true" ]; then
            "./bin/${BINARY}" --validate
          fi
          mkdir -p artifacts
          cp "bin/${BINARY}" artifacts/
          (cd artifacts && openssl dgst -r -sha256 "$BINARY" > "${BINARY}.sha256")

      # gh resolves an unpublished draft by its INTENDED tag for upload/view
      # (the @v1 reusable relied on the same), and --clobber replaces the
      # previous merge's asset on an updated draft. Whichever build step ran
      # left its artifact set in artifacts/ — upload it wholesale.
      #
      # The artifact-mode arm of the condition is load-bearing, not tidiness:
      # with no build step there is no artifacts/, the glob stays literal, and
      # `gh release upload … artifacts/*` fails the run for a draft that is
      # already correct.
      - name: Attach the artifacts to the draft
        if: steps.verdict.outputs.release == 'true' && !inputs.dry-run && (inputs.app != '' || inputs.binary != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verdict.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" artifacts/* --clobber

      # Separate from the upload, and NOT gated on the artifact mode: the URL
      # of the draft a human has to go and publish is the one thing every
      # caller needs out of this run, verdict-only included. It rode inside
      # the upload step until verdict-only mode existed, which would have made
      # the mode that ships nothing also the mode that says nothing.
      - name: Say where the draft is
        if: steps.verdict.outputs.release == 'true' && !inputs.dry-run
        env:
          TAG: ${{ steps.verdict.outputs.tag }}
        run: |
          set -euo pipefail
          url="$(jq -r '.url // empty' "$RUNNER_TEMP/verdict.json")"
          echo "::notice::Draft release ${TAG} upserted (unpublished, no tag yet). Review & Publish manually: ${url}"
          {
            echo "## Draft release ${TAG} upserted (unpublished)"
            echo
            echo "Merging more to main grows this draft. Review and Publish"
            echo "manually (the tag is created at Publish time): ${url}"
          } >> "$GITHUB_STEP_SUMMARY"

      # dry_run (workflow_dispatch only): nothing was written; upload the
      # notes + artifact so the exact would-be release is previewable without
      # consuming a version.
      - name: Upload preview (dry run)
        if: steps.verdict.outputs.release == 'true' && inputs.dry-run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview-${{ steps.verdict.outputs.tag }}
          path: |
            artifacts/
            ${{ runner.temp }}/verdict.json

      - name: Dry-run summary
        if: steps.verdict.outputs.release == 'true' && inputs.dry-run
        env:
          TAG: ${{ steps.verdict.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## Dry run: ${TAG} (nothing written)"
            echo
            echo "the draft action would be: $(jq -r .action "$RUNNER_TEMP/verdict.json")"
            echo
            echo '```'
            jq -r .body "$RUNNER_TEMP/verdict.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
