name: build

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared Go CI core (build / vet / race-test / module-hygiene / golangci-lint v2),
  # SHA-pinned once in the hub. go.mod carries a `toolchain` line, so gotoolchain is
  # left unset — setup-go honors and pins it (see the reusable's header footgun note).
  # `coverage` prints the total off the race run's own profile: a REPORT, never a
  # gate (t-37mg; scripts/check.sh's coverage step carries the reason).
  ci:
    uses: akira-toriyama/.github/.github/workflows/go-ci.yml@v2
    with:
      go-version-file: go.mod
      coverage: true

  # Do the tests this pull request adds actually bite? The gate runs them against
  # the source BEFORE the pull request and fails the ones that all still pass — a
  # test that would have been green without its own fix is not evidence of that fix,
  # and nothing but habit was checking. Stands down on its own when there is nothing
  # to prove (no shipping change, no new test, an annotated behaviour pin), so it
  # costs a pull request nothing to carry.
  # Rationale + the two opt-outs: akira-toriyama/.github/blob/main/docs/go-bite.md
  bite:
    uses: akira-toriyama/.github/.github/workflows/go-bite.yml@v2
    with:
      go-version-file: go.mod

  # Do the tests still BITE? `bite` above asks it of the tests a pull request
  # ADDS, and is satisfied by any one of them; this asks it of a standing list of
  # decisions, one row at a time, and stays red until every named test fails
  # under its mutation. The two are not substitutes: `bite` cannot notice a test
  # that rotted three releases ago, and coverage cannot notice a line every test
  # executes but nobody asserts — which is exactly what was measured on
  # gitsource's shallow / did-it-land paths (testdata/mutations/README.md).
  # Its own job because it snapshots, patches and rebuilds the tree per row, and
  # a red here means something different from a red unit test.
  mutations:
    runs-on: ubuntu-latest
    # 29 runs measured 2026-10-27: 623–1106 s; 20 left 8% headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum
      - name: mutation ledger
        run: sh scripts/mutations.sh

  # A change to what glyph SHIPS must carry evidence, exactly as a change to
  # what it computes must. `bite` above acts on Go diffs only and the smoke
  # below reads no YAML, so a :bug: fix touching only .goreleaser.yaml or the
  # install action used to reach main with zero tests and no gate noticing
  # (t-5dbh). This job closes that: a distribution-layer file in the diff with
  # no internal/workflows test change fails the pull request. File set, the
  # pin-swap stand-down, waiver (`Dist-gate-exempt:` trailer) and rationale:
  # scripts/dist-gate.sh.
  # PR-only because the gate judges a diff; a push to main carries none.
  dist-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate diffs BASE...HEAD and reads trailers across the range; a
          # depth-1 checkout holds neither the base nor the commits.
          fetch-depth: 0
      - name: distribution-layer gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/dist-gate.sh "$BASE_SHA"

  # A golden file is a format spec stored as bytes, and `go test -update`
  # rewrites it from whatever the code currently produces — so a rendering bug
  # can arrive LOOKING intentional, with nothing forcing anyone to read the
  # diff as the spec change it is. This job is that force: a golden diff with
  # no `Golden-change: <reason>` trailer on every non-merge commit fails the
  # pull request. File set, non-waiver stance and rationale:
  # scripts/golden-gate.sh. PR-only because the gate judges a diff.
  golden-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate diffs BASE...HEAD and reads trailers across the range; a
          # depth-1 checkout holds neither the base nor the commits.
          fetch-depth: 0
      - name: golden-file gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/golden-gate.sh "$BASE_SHA"

  # Repo-specific checks that don't belong in the shared core. The smoke runs on
  # every leg so the shipped binary is exercised on every released platform shape:
  # darwin (brew cask) and linux arm64 (free for public repos) beside linux amd64
  # — the core test job (build + unit tests) covers none of these. The fuzz smoke
  # is Linux-only (house pattern): it discovers every Fuzz target and runs each
  # briefly, so new targets are covered with no edit here.
  extras:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build/test-only, never pushes — drop the persisted checkout token
          # (zizmor artipacked). t-yaxa
          persist-credentials: false
          # glyph's own release tags: the release-history step below reads
          # every one. go-ci's depth-1 checkout holds none, so the test
          # skips there and this is its only CI home.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
          # setup-go keys the cache off go.mod by default; go.sum is the actual
          # dependency identity, so name it explicitly.
          cache-dependency-path: go.sum

      # Each caller-check table row names the newest release whose reusable
      # declared otherwise (After); doctor judges a caller only above it
      # (DESIGN §7). The test re-reads every release tag's reusables and fails
      # when a row's After is not that release. -count=1 because the verdict
      # depends on git tags, which Go's test cache does not track; the env
      # turns the test's no-history skip into a failure. Linux-only like the
      # fuzz smoke — the answer is a fact about the tags, not the platform.
      - name: release-history bounds
        if: runner.os == 'Linux'
        run: GLYPH_RELEASE_HISTORY=required go test ./internal/doctor -run '^TestCallerDeclarationBoundsMatchReleasedTags$' -count=1

      # The binary's CLI contract and the bounded fuzz loop live once, in
      # scripts/smoke.sh and scripts/fuzz-smoke.sh; scripts/check.sh runs the
      # same two files.
      - name: smoke test
        run: |
          go build -o /tmp/glyph ./cmd/glyph
          sh scripts/smoke.sh /tmp/glyph

      - name: fuzz smoke (bounded)
        if: runner.os == 'Linux'
        run: sh scripts/fuzz-smoke.sh
