name: goreleaser

# Tag-driven release: pushing a vX.Y.Z tag runs GoReleaser (binaries, checksums,
# Homebrew cask) and attaches build-provenance attestations. Deliberately NOT on
# every main push — that would run GoReleaser with no tag. Use workflow_dispatch
# for a manual run.
#
# Renamed from release.yml at v0.3.0: release.yml is now the reusable
# rolling-draft release the FAMILY consumes (DESIGN §6), while this file cuts
# glyph's OWN releases. This path is also the attestation SIGNER identity —
# what `gh attestation verify --signer-workflow` checks (artifacts up to v0.2.0
# were attested as release.yml, v0.3.0+ as goreleaser.yml). The path is written
# once, in .github/actions/install/action.yml, and every reusable installs the
# binary of the tag it is pinned at through the action of that same tag — so
# renaming this file rotates the signer for every later pin. Rename it only
# together with the path in action.yml, in the same release.
#
# The notes step below builds `glyph notes` FROM THE TAGGED COMMIT instead of
# installing a release binary through the install action, as the other
# glyph-noted repositories do: the tag being cut has no release binary yet —
# this run is what makes it. The result goes to GoReleaser via
# --release-notes. This closes t-8hqn: GoReleaser's
# built-in changelog printed raw commit subjects, so a subject containing `@v2`
# or `@mentions` pinged strangers from glyph's own releases — the one surface
# t-hykw's escaping did not cover.
#
# --release-notes only lands if the changelog pipe stays ENABLED in
# .goreleaser.yaml: GoReleaser loads the file inside that pipe, so a
# `changelog.disable: true` drops it and ships an empty body (v0.8.2 did — see
# t-bb72). The neutered exclude-everything filter there is what keeps the
# built-in generator from ever writing raw subjects; don't swap it back for a
# disable. internal/workflows guards the pairing.
#
# Requires the HOMEBREW_TAP_DEPLOY_KEY secret (private half of homebrew-tap's write
# deploy key) for the cask push — fleet-sync fans it out, gated on this file
# referencing it (t-6bhz). Without it the build + attestation still run and only the cask step fails.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # create the GitHub release
  id-token: write      # keyless signing for provenance attestation
  attestations: write  # write the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GoReleaser only READs local git; every write (release, cask push)
          # goes through API tokens passed as env, never git — drop the
          # persisted checkout token (zizmor artipacked). t-yaxa
          persist-credentials: false

      # The tag's major must be the module path's. Go resolves a module by the
      # /vN suffix in go.mod, and a tag alone supplies nothing: a v6.0.0 cut
      # over a /v5 go.mod is no module version at all — the proxy rejects
      # /v6@v6.0.0 and `go install …/v5/cmd/glyph@latest` keeps handing out
      # v5.1.0 (measured 2026-10-26; v2.0.0 and v3.0.0 shipped the same way
      # over no suffix, #222). Nothing else compares the two:
      # TestModulePathCarriesTheMajorAndReadmeSpellsIt reads no tag by design,
      # and a doctor check was rejected (t-nag8: glyph reads no manifest, and
      # no workflow in the fleet runs doctor). This job is the one place that
      # holds both the tag and the tree, so it refuses here, before any asset
      # exists — the tag is already pushed and cannot carry the fix; the next
      # patch under the moved path can (v6.0.1). Before setup-go: shell over
      # go.mod's text and the ref name only. GITHUB_REF_NAME is the pushed tag,
      # as the notes action below reads it. The grammar is the binary's own for
      # below: (bump.parseBaseVersion — a release candidate names its
      # release's major). internal/workflows runs this step over the tags that
      # were cut and the ones that must not be.
      - name: the tag's major is the module path's
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ $re ]]; then
            echo "::error::$tag is not a version tag (vX.Y.Z, with an optional -prerelease); this job releases version tags only"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          path="$(sed -En 's/^module[[:space:]]+([^[:space:]]+)[[:space:]]*$/\1/p' go.mod | head -n 1)"
          if [ -z "$path" ]; then
            echo "::error::go.mod declares no module path, so nothing says which major $tag belongs to"
            exit 1
          fi
          have="$(printf '%s\n' "$path" | sed -En 's#^.*(/v[0-9]+)$#\1#p')"
          want=""
          if [ "$major" -ge 2 ]; then
            want="/v$major"
          fi
          if [ "$have" != "$want" ]; then
            echo "::error::$tag is cut over go.mod's module path $path, whose major suffix is ${have:-none} where this tag needs ${want:-none}. Go resolves a module by that suffix, so $tag is no module version at all: the proxy rejects it and \`go install …@latest\` keeps serving the last version under the path's own major. The tag is already pushed and cannot carry the fix — move the path (go.mod and every import; DESIGN §5) and cut the next patch under it. Refusing before any asset is built."
            exit 1
          fi
          echo "go.mod's module path $path carries ${have:-no major suffix}, which is what $tag needs"

      # No job-level `env: GOTOOLCHAIN: local` — see build.yml. It would make
      # setup-go skip go.mod's `toolchain` line and ship release binaries built
      # with the bare floor. setup-go pins GOTOOLCHAIN=local itself.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Release binaries must not be built from a shared, poisonable module
          # cache (zizmor cache-poisoning); PR-time caching stays in build.yml.
          # t-yaxa
          cache: false

      # glyph runs as a BUILT binary, never `go run`: `go help run` states that
      # Run's exit status is not the compiled binary's — cmd/go collapses
      # glyph's 2/3/4 into 1 (measured), and 1 is the one value the notes
      # action reads as the soft no-release signal, so a dark API would publish
      # a placeholder release body behind a real tag, green, and a wedged walk
      # one that says nothing was release-worthy. Built from THIS tree rather
      # than installed through the install action: the release being cut is
      # the one the action would install.
      - name: build glyph for its own release notes
        run: go build -o "$RUNNER_TEMP/glyph" ./cmd/glyph

      # The rule is the action's (its header); this file hands it the binary
      # above, the tag being cut and the file GoReleaser reads below.
      - name: release notes via glyph itself
        uses: ./.github/actions/release-notes
        with:
          glyph: ${{ runner.temp }}/glyph
          tag: ${{ github.ref_name }}
          output: ${{ runner.temp }}/release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Pin the GoReleaser TOOL to the v2 line (never `latest`).
          version: "~> 2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private half of homebrew-tap's write deploy key (fleet-sync fans it
          # out); GoReleaser pushes the cask over SSH with it. t-6bhz
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          # The tag this run is FOR, stated — never inferred. GoReleaser picks
          # its current tag with `git describe` when this is unset, and a
          # commit carrying two tags (a release cut on the same tree as its
          # last rc) makes that a coin toss: measured 2026-09-10, the v3.3.0
          # push built 3.3.0-rc.2 artifacts and tried to upload them onto the
          # rc.2 release (422 already_exists), leaving v3.3.0 with no release
          # while every pin site was about to move to it.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz, dist/checksums.txt'
