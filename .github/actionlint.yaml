# actionlint configuration (read by the fleet actionlint gate,
# akira-toriyama/.github t-ya55).
#
# job.workflow_ref / job.workflow_repository / job.workflow_sha are real at
# runtime — the reusables here use them to resolve the tag the CALLER pinned
# this workflow to (lint.yml "Resolve the pinned glyph version") and to check
# out glyph's own tree at that commit. They have shipped in every release run
# since the reusables existed. actionlint 1.7.12 (latest as of 2026-07) has not
# yet added them to its `job` context schema, so it flags each use as an
# undefined property. Scope-waive exactly that message; drop this file once
# actionlint's schema catches up.
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'property "workflow_(ref|repository|sha)" is not defined in object type'
