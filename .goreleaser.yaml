version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: glyph
    main: ./cmd/glyph
    binary: glyph
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/akira-toriyama/glyph/internal/version.Version={{.Version}}
      - -X github.com/akira-toriyama/glyph/internal/version.Commit={{.Commit}}
      - -X github.com/akira-toriyama/glyph/internal/version.Date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Release notes are glyph's own: the goreleaser.yml workflow runs `glyph notes`
# from the tagged commit and passes the file via --release-notes (t-8hqn).
#
# This pipe must stay ENABLED. GoReleaser loads --release-notes INSIDE the
# changelog pipe (changelog.Run reads ctx.ReleaseNotesFile, then returns early
# before generating anything), while `disable: true` short-circuits that pipe in
# changelog.Skip. So disabling it silently drops the notes file and ships an
# EMPTY body — which is exactly what v0.8.2 shipped (t-bb72).
#
# Instead the built-in generator is neutered with an exclude-everything filter,
# which keeps the property the disable was reaching for: with the flag, the file
# wins (the early return means these filters never run); without it, the body is
# empty rather than falling back to the raw commit subjects that carry the
# unescaped-@mention surface this dogfooding removed. Loud, not wrong.
changelog:
  filters:
    exclude:
      - ".*"

# Homebrew cask pushed to the family tap on release. GoReleaser v2 ships prebuilt
# binaries as CASKS (the old `brews:` formula path is deprecated); the live
# Casks/glyph.rb in akira-toriyama/homebrew-tap is regenerated each release.
# Install: brew install akira-toriyama/tap/glyph.
homebrew_casks:
  - repository:
      owner: akira-toriyama
      name: homebrew-tap
      # Pushed over SSH with the tap's write deploy key (fleet-sync fans the
      # secret out; t-6bhz) — not the GitHub API, so no account-scoped token.
      git:
        url: "git@github.com:akira-toriyama/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    # `auto` = skip the tap push when the tag carries a prerelease part
    # (v3.0.0-rc.1). A release candidate exists to be installed by the
    # reusables and executed as a fleet gate before the fleet's pins move; it
    # is not what `brew install akira-toriyama/tap/glyph` should hand a human,
    # least of all across a breaking grammar change. Without this the cask is
    # regenerated on every `v*` tag, so the first rc of v3 would have made the
    # tap serve v2's replacement to everyone who typed `brew upgrade`.
    skip_upload: auto
    directory: Casks
    homepage: https://github.com/akira-toriyama/glyph
    description: "gitmoji-driven commit-lint, semver, and release notes for squash-merge repos"
    # The binary is unsigned; strip the quarantine xattr on macOS so Gatekeeper
    # allows launch (same pattern as the family's other casks).
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/glyph"]
          end

release:
  # Publish at tag time, no draft. A draft's assets are 404 to anonymous
  # clients while homebrew_casks above has ALREADY pushed the new version to
  # the tap in this same run — so every draft is a window where
  # `brew install` is broken, bounded only by how soon a human remembers to
  # publish. cifail sat unpublished for 17 days that way. pare and rundiff
  # never had the window; this matches them, and the notes no longer need a
  # human pass since glyph generates and escapes them (t-8hqn) and
  # pr-verdict previews them at PR time.
  draft: false
  # `auto` marks a hyphenated tag (v3.0.0-rc.1) as a prerelease, which is the
  # only thing that keeps GitHub's `latest` pointer — what `gh release view
  # --latest`, the releases page and every "what should I pin?" glance read —
  # off a candidate. GoReleaser's default is `false`, i.e. every tag publishes
  # as a full release, so before this key an rc was indistinguishable from a
  # shipped version at exactly the moment the distinction matters: proving a
  # breaking grammar on a real binary the reusables install (t-x3ed) without
  # yet claiming the fleet should move to it. Deleting rc assets afterwards
  # cannot un-move `latest` for whoever looked in between.
  prerelease: auto
