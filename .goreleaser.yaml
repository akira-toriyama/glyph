version: 2

builds:
  - id: glyph
    main: ./cmd/glyph
    binary: glyph
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      # {{.Tag}}, not {{.Version}}: GoReleaser's Version drops the leading v, so
      # every release through v5.0.0 reported "5.0.0" while build.sh, `go
      # install …@vX.Y.Z` and README say vX.Y.Z — and the install action
      # compares this stamp with the tag it was asked for. The archive name
      # below keeps {{ .Version }}: the install action derives it as ${ver#v}.
      - -X github.com/akira-toriyama/glyph/v6/internal/version.Version={{.Tag}}
      - -X github.com/akira-toriyama/glyph/v6/internal/version.Commit={{.Commit}}
      - -X github.com/akira-toriyama/glyph/v6/internal/version.Date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Release notes are glyph's own: the goreleaser.yml workflow runs `glyph notes`
# from the tagged commit and passes the file via --release-notes.
#
# This pipe must stay ENABLED. GoReleaser loads --release-notes INSIDE the
# changelog pipe (changelog.Run reads ctx.ReleaseNotesFile, then returns early
# before generating anything), while `disable: true` short-circuits that pipe in
# changelog.Skip. So disabling it silently drops the notes file and ships an
# EMPTY body — which is exactly what v0.8.2 shipped.
#
# Instead the built-in generator is neutered with an exclude-everything filter,
# which keeps the property the disable was reaching for: with the flag, the file
# wins (the early return means these filters never run); without it, the body is
# empty rather than falling back to the raw commit subjects that carry the
# unescaped-@mention surface this dogfooding removed. Loud, not wrong.
changelog:
  filters:
    exclude:
      - ".*"

# Homebrew cask for the family tap. GoReleaser v2 ships prebuilt binaries as
# CASKS (the old `brews:` formula path is deprecated). GoReleaser WRITES the
# cask — dist/homebrew/Casks/glyph.rb — and pushes nothing (skip_upload): the
# file goes onto the release as an asset (release.extra_files below) and
# goreleaser.yml's cask job takes it from the published release and pushes it
# to the tap. Pushed from here it would go out inside GoReleaser's run, before
# the attest step can, naming a draft's assets — 404 to every `brew install`
# until the publish, and public before anything proved who built it (t-p15y).
# Install: brew install akira-toriyama/tap/glyph.
homebrew_casks:
  - repository:
      # Named so GoReleaser writes the file at all — it skips the pipe over an
      # unnamed repository. Nothing here is pushed to.
      owner: akira-toriyama
      name: homebrew-tap
    skip_upload: true
    directory: Casks
    homepage: https://github.com/akira-toriyama/glyph
    description: "sigil-driven commit-lint, semver, and release notes for squash-merge repos"
    # The binary is unsigned; strip the quarantine xattr on macOS so Gatekeeper
    # allows launch. Homebrew's declarative steps DSL (`postflight_steps`,
    # brew 6f0b2e2 2026-05-24): GoReleaser 2.19 deprecated the Ruby `install:`
    # block and `goreleaser check` exits 2 over it at 2.20.0.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/glyph"]
          end

release:
  # A draft, published by goreleaser.yml once the attestation exists.
  # GoReleaser's own publish runs before any step outside it can, so with
  # `draft: false` v6.1.0's assets were public 9s before "Attestation created"
  # (run 40457384503) — and the install action verifies provenance
  # fail-closed, so an attest step that failed would have left a public
  # release the whole fleet cannot install. The brew-404 window a draft once
  # opened (cifail v0.1.1 sat unpublished for 17 days, its tap already naming
  # it) is closed by order, not by publishing early: the cask job runs after
  # the publish step, and no human publishes anything.
  draft: true
  # A re-run after a failure that left the draft behind must land on THAT
  # draft, not mint a second one. GoReleaser looks a release up by tag, and
  # GitHub's tag lookup does not see drafts; use_existing_draft lists the
  # drafts by name instead. An asset the earlier run uploaded is a 422 on
  # re-upload unless replaced. Both are safe only while the release is a
  # draft: over a tag whose release is public, goreleaser.yml skips every
  # build step, GoReleaser included, and the job succeeds having touched
  # nothing, so the cask job can finish.
  use_existing_draft: true
  replace_existing_artifacts: true
  # The cask file rides on the release: the cask job reads it from the
  # published release, so a run that finds the tag already published can
  # still push the tap without rebuilding anything. The cask pipe writes the
  # file before the release pipe uploads (internal/pipeline/pipeline.go,
  # v2.20.0), and the upload replaces an existing asset like any other.
  extra_files:
    - glob: dist/homebrew/Casks/glyph.rb
  # `auto` marks a hyphenated tag (v3.0.0-rc.1) as a prerelease, which is the
  # only thing that keeps GitHub's `latest` pointer — what `gh release view
  # --latest`, the releases page and every "what should I pin?" glance read —
  # off a candidate. GoReleaser's default is `false`, i.e. every tag publishes
  # as a full release, so before this key an rc was indistinguishable from a
  # shipped version at exactly the moment the distinction matters: proving a
  # breaking grammar on a real binary the reusables install without
  # yet claiming the fleet should move to it. Deleting rc assets afterwards
  # cannot un-move `latest` for whoever looked in between.
  prerelease: auto
