# glyph.toml — generated by `glyph init --conventional`
schema = 1

# Commits by these authors are excluded from lint and the version fold.
# (Whether they appear in the notes is decided by note.sections alone.)
exclude_authors = ['dependabot[bot]', 'renovate[bot]']

[commit]
style = "conventional"

# Conventional Commits with an explicit version sigil before the colon:
#   feat^: add a thing        (minor)
#   fix~: repair a thing      (patch)
#   chore=: touch nothing     (none)
#   feat(api)!: drop a flag   (major — conventional's own `feat!:` reads as
#                              the major sigil unchanged)
# The type word is free; it aids the reader and never decides the version.
#
# The template is for humans; glyph never parses it. lint quotes its first
# line back when a message matches no pattern, so keep that line the form.
template = '''
<type>[(scope)]<semver_sigil>: <subject>

[<body>]
'''

# The regexes glyph runs over the whole message (RE2 syntax — lookahead and
# backreferences are unsupported). Top to bottom, the first pattern that
# matches wins.
# The named group `semver_sigil` must capture one of  = ~ ^ ! %
#   = none / ~ patch / ^ minor / ! major / % promote to 1.0.0
# While the version is still 0.x a `!` steps the MINOR (0.4.2 -> 0.5.0), so
# breaking things early cannot accidentally claim a stable 1.0. `%` is the one
# way out: it lands exactly on 1.0.0, and behaves as `!` from 1.x on.
# A pattern-level `semver_sigil` key supplies a fixed value when the message
# carries none. `skip = true` drops a matching commit from lint, bump and
# notes entirely (a skipped commit is not a violation). `warn = '<message>'`
# keeps a match legal and says so at every gate — for a pattern you accept
# but would rather not see. `unlandable = '<reason>'` marks a message that may
# be written but must not land: the commit-msg hook lets it through with the
# reason as a warning, and every gate that judges an existing commit refuses
# it (needs glyph v4.2.0 wherever this file is read — an older glyph refuses
# the unknown key).
[[patterns]]
# The subject group is the WHOLE line, type + scope + sigil included, so a
# release-body line reads exactly as its commit does (`feat(cli)^: add the
# thing`) instead of the bare text after the colon. Nothing else reads the
# group: bump reads semver_sigil, lint reads the match, and note.line's
# `$subject` is the only consumer. Keeping the name `subject` (rather than
# adding a `$raw` group to the template) is what keeps the revert pattern and
# the unmatched-commit fallback — both bind `subject` alone — rendering
# unchanged.
pattern = '^(?P<subject>(?P<type>[a-z]+)(\((?P<scope>[a-z0-9-]+)\))?(?P<semver_sigil>[=~^!%]): .+)'

[[patterns]]
# raw `git revert`. The subject group takes the WHOLE line, quotes and all,
# so a release body says a revert happened: capturing only the text inside the
# quotes renders the reverted commit's own subject under Fixes, which reads as
# that change being made rather than undone (measured — glyph-test v0.4.1
# shipped `- :sparkles:(soak)^ add the page ... (#53) (#54)` in its Fixes
# section, describing the feature it had just removed).
pattern = '^(?P<subject>Revert ".+")'
semver_sigil = '~'

[[patterns]]
# merge commits stay out of every check
pattern = '^Merge '
skip = true

[[patterns]]
# autosquash artifacts — fixup! and squash!, what --fixup=<c> and --squash=<c>
# write. rebase --autosquash folds each into its target with the TARGET's
# subject, and so its sigil, intact — the one property that makes a skip safe.
pattern = '^(fixup|squash)! '
skip = true

[[patterns]]
# amend! (what --fixup=amend:<c> and --fixup=reword:<c> write) is NOT skipped:
# autosquash REPLACES its target's message with the amend! body, so a skip
# would fold the sigil the rewrite discards and miss the one it lands. It is
# unlandable instead: the commit-msg hook lets git's own subject through with
# the reason below as a warning (refusing it there would force --no-verify),
# and every gate that judges an existing commit — lint --range, --pr, bump,
# the release walk — refuses it until rebase --autosquash has folded it away.
# The claim reads the BODY, because the body is what lands: it covers only a
# body that opens the way the first pattern's subject does (keep the two in
# step). Any other body stays unmatched, refused everywhere, the hook
# included — above all the one --fixup=amend:<a fixup! commit> prepares, that
# fixup!'s own line, which autosquash would land as the target's whole
# message for the skip above to drop. One chain no single message shows:
# after a squash! of the same target, git APPENDS the body instead, and the
# target's old first line lands unless the rebase's combined message is
# edited — so the reason says it at the hook.
pattern = '^amend! .*\n\n[a-z]+(\([a-z0-9-]+\))?[=~^!%]: .'
unlandable = 'autosquash lands this body as its target message (after a squash! of the same commit git appends it instead: edit the combined message so its first line carries the sigil); run git rebase --autosquash before this history is pushed or merged'

[note]
# One line per commit. $xxx reads the winning pattern's named groups;
# $pr / $author / $hash / $coauthors are built in. A commit no pattern
# matches (bots) falls back to its raw first line.
#
# $[ ... ] is an optional span: it renders only when EVERY $xxx inside it
# resolves to something, and takes its own punctuation with it when one does
# not. $pr is empty for every commit that reached main without a merged pull,
# which is every commit under --range — so the parens below sit inside a span.
# Written outside one they shipped as a bare `()` in the release body.
#
# $coauthors is the commit's `Co-authored-by` names — address stripped,
# comma-joined, read with git's own trailer parser rather than grepped. Most
# commits carry none, so it takes a span of its own. It renders as prose and
# never as a mention: a co-author address asserts a login glyph cannot verify.
line = '- $subject$[ ($pr)] @$author$[ with $coauthors]'

# Keep an "Unreleased" placeholder draft alive across merges that do not
# move the version (false = no draft until something does).
draft_on_none = false

# [[note.trailers]] binds one of THIS repository's own trailer words to a
# $name the line above can render. glyph cannot interpret such a value, so it
# renders as prose and can never become a mention — which is why naming the
# word is a repository's business and naming an identity is not. None is
# declared here; a name that binds to a trailer nobody writes renders empty
# forever. Declare what this repository actually writes:
#
#   [[note.trailers]]
#   token = "Why"
#   name = "why"
#
# and reference it in the line above, inside a span: `$[ — $why]`.

# Section order is render order. Each section filters on exactly one axis
# (semver or author); a commit may appear in several sections.
[[note.sections]]
semver = "major"
title = "Breaking Changes"

[[note.sections]]
semver = "minor"
title = "Features"

[[note.sections]]
semver = "patch"
title = "Fixes"

[[note.sections]]
author = 'dependabot[bot]'
title = "Dependencies"
