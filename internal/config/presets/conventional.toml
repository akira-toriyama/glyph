# glyph.toml — generated by `glyph init --conventional`
schema = 1

# Commits by these authors are excluded from lint and the version fold.
# (Whether they appear in the notes is decided by note.sections alone.)
exclude_authors = ['dependabot[bot]', 'renovate[bot]']

[commit]
style = "conventional"

# Conventional Commits with an explicit version sigil before the colon:
#   feat^: add a thing        (minor)
#   fix~: repair a thing      (patch)
#   chore=: touch nothing     (none)
#   feat(api)!: drop a flag   (major — conventional's own `feat!:` reads as
#                              the major sigil unchanged)
# The type word is free; it aids the reader and never decides the version.
#
# The template is for humans and the commit hook; glyph never parses it.
template = '''
<type>[(scope)]<semver_sigil>: <subject>

[<body>]
'''

# The regexes glyph runs over the whole message (RE2 syntax — lookahead and
# backreferences are unsupported). Top to bottom, the first pattern that
# matches wins.
# The named group `semver_sigil` must capture one of  = ~ ^ !
#   = none / ~ patch / ^ minor / ! major
# A pattern-level `semver_sigil` key supplies a fixed value when the message
# carries none. `skip = true` drops a matching commit from lint, bump and
# notes entirely (a skipped commit is not a violation).
[[patterns]]
pattern = '^(?P<type>[a-z]+)(\((?P<scope>[a-z0-9-]+)\))?(?P<semver_sigil>[=~^!]): (?P<subject>.+)'

[[patterns]]
# raw `git revert`
pattern = '^Revert "(?P<subject>.+)"'
semver_sigil = '~'

[[patterns]]
# merge commits stay out of every check
pattern = '^Merge '
skip = true

[note]
# One line per commit. $xxx reads the winning pattern's named groups;
# $pr / $author / $hash are built in. A commit no pattern matches (bots)
# falls back to its raw first line.
line = '- $subject ($pr) @$author'

# Keep an "Unreleased" placeholder draft alive across merges that do not
# move the version (false = no draft until something does).
draft_on_none = false

# Section order is render order. Each section filters on exactly one axis
# (semver or author); a commit may appear in several sections.
[[note.sections]]
semver = "major"
title = "Breaking Changes"

[[note.sections]]
semver = "minor"
title = "Features"

[[note.sections]]
semver = "patch"
title = "Fixes"

[[note.sections]]
author = 'dependabot[bot]'
title = "Dependencies"
