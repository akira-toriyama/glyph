# glyph.toml — generated by `glyph init --gemoji`
schema = 1

# この author の commit は lint と bump 計算から除外する
# (note に載るかどうかは note.sections だけが決める)
exclude_authors = ['dependabot[bot]', 'renovate[bot]']

[commit]
style = "gemoji"

# 人間(と commit hook)向けのテンプレート
template = '''
<:code:>[(scope)]<semver_sigil> <subject>

[<body>]
'''

# glyph が message にかける正規表現(RE2 構文・lookahead 不可)。
# 上から順に、最初に match した pattern が勝つ。
# named group `semver_sigil` が必須で、中身は = ~ ^ ! のいずれか
#   = none / ~ patch / ^ minor / ! major
# pattern 側に semver_sigil キーを書くと、message に sigil が無くても固定値で与えられる
# pattern 側に skip = true を書くと、match した commit を lint/bump/note の全処理から落とす
# (skip された commit は「不一致 = violation」扱いにならない。git-cliff の commit_parsers 由来)
[[patterns]]
pattern = '^:[a-z0-9_]+:(\((?P<scope>[a-z0-9-]+)\))?(?P<semver_sigil>[=~^!]) (?P<subject>.+)'

[[patterns]]
# raw git revert
pattern = '^Revert "(?P<subject>.+)"'
semver_sigil = '~'

[[patterns]]
# merge commit は対象外
pattern = '^Merge '
skip = true

[note]
# 各 commit を 1 行にする template。
# $xxx は pattern の named group、$pr / $author / $hash は組み込み。
# pattern に match しない commit(bot 等)は raw の 1 行目を使う
line = '- $subject ($pr) @$author'

# release 直後、semver が動かない merge でも "Unreleased" draft を維持するか
draft_on_none = false

# 章立て: 並び順 = 描画順。各章は filter で、軸(semver / author)を明示する。
# 1 commit が複数の章に match したら両方に載る
[[note.sections]]
semver = "major"
title = "Breaking Changes"

[[note.sections]]
semver = "minor"
title = "Features"

[[note.sections]]
semver = "patch"
title = "Fixes"

[[note.sections]]
author = 'dependabot[bot]'
title = "Dependencies"
